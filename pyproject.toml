[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suspension-calculator"
version = "0.1.0"
description = "A suspension calculator application"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pydantic>=2.0.0",
    "PyQt6",
    "QtAwesome>=1.2.3",
    "py-memoize>=3.1.1"
]

[tool.setuptools.package-data]
suspension = ["py.typed"]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller",
    "coverage[toml]>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.1.1",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "pre-commit>=3.5.0",
    "types-Pillow",
    "types-setuptools",
    "virtualenv>=20.25.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
    "if typing.TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.19"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# Add Qt specific ignores
[[tool.mypy.overrides]]
module = "PyQt6.*"
ignore_missing_imports = true


[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88  # Match black's line length
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.format]
# Enable reformatting with ruff
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["suspension_calculator"]

# Configure PyCharm to run both tools
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
