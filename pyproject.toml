[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suspension-calculator"
version = "0.1.0"
description = "A suspension calculator application"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller",
    "coverage[toml]>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.1.1",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "pyright>=1.1.350",
    "types-Pillow", # for matplotlib
    "types-setuptools", # for setup.py
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
    "if typing.TYPE_CHECKING:",
]